<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>文章详情</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box‑sizing:border‑box;margin:0;padding:0;font‑family:system‑ui}
body{background:#f3f4f6;padding:22px}
.container{max‑width:850px;margin:0 auto;background:white;padding:30px;border‑radius:10px}
.title{font‑size:26px;margin‑bottom:14px}
.content{line‑height:1.7;font‑size:16px;margin‑bottom:40px;white‑space:pre‑wrap}
.comment‑area{margin‑top:50px;border‑top:1px solid #ddd;padding‑top:24px}
.comment‑item{padding:14px;border:1px solid #eee;margin:10px 0;border‑radius:6px}
textarea{width:100%;padding:10px;border:1px solid #ccc;border‑radius:6px;min‑height:100px}
button{padding:9px 16px;background:#2563eb;color:white;border:none;border‑radius:6px;cursor:pointer;margin‑top:8px}
.back{margin‑bottom:20px;display:inline‑block}
</style>
</head>
<body>
<div class="container">
<div class="back"><a href="blog.html">← 返回博客列表</a></div>
<h1 class="title" id="title"></h1>
<div class="content" id="content"></div>

<div class="comment‑area">
<h3>💬讨论区留言</h3>
<textarea id="ctext" placeholder="登录后发表留言"></textarea>
<button onclick="submitComment()">提交留言</button>
<div id="commentWrap"></div>
</div>
</div>

<script>
const SUPABASE_URL = "https://scrmlnmmmixstxcmvcyw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjcm1sbm1tbWl4c3R4Y212Y3l3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NTgzMTcsImV4cCI6MjEwMjUzNDMxN30.oIZ8OYHpii6SdYy1zTlMAF4MHWfFDOJJDdiJp4luH_s";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let aid,loginUid=null;

function getParam(k){
  return new URLSearchParams(location.search).get(k);
}

async function init(){
  aid=getParam("id");
  if(!aid){location.href="blog.html";return;}
  const {data:art}=await supabase.from("articles").select("*").eq("id",aid).single();
  if(!art){location.href="blog.html";return;}
  document.getElementById("title").innerText=art.title;
  document.getElementById("content").innerText=art.content;
  const {data:{session}}=await supabase.auth.getSession();
  if(session) loginUid=session.user.id;
  loadComments();
}

async function loadComments(){
  const {data}=await supabase.from("comments").select("*").eq("article_id",aid).order("created_at",{asc:false});
  const wrap=document.getElementById("commentWrap");
  wrap.innerHTML="";
  if(!data||!data.length){wrap.innerHTML="<p>暂无评论</p>";return;}
  data.forEach(c=>{
    wrap.innerHTML+=`
    <div class="comment‑item">
      <div>用户ID:${c.user_id||"匿名"}｜${new Date(c.created_at).toLocaleString()}</div>
      <div style="margin‑top:6px">${escapeHtml(c.content)}</div>
    </div>
    `
  })
}

async function submitComment(){
  if(!loginUid){alert("请登录后留言");location.href="login.html";return;}
  const txt=document.getElementById("ctext").value.trim();
  if(!txt){alert("内容不能为空");return;}
  const {error}=await supabase.from("comments").insert({article_id:aid,user_id:loginUid,content:txt});
  if(error){alert("提交失败："+error.message);return;}
  document.getElementById("ctext").value="";
  loadComments();
}
function escapeHtml(s){
  if(!s)return"";
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
init();
</script>
</body>
</html>
