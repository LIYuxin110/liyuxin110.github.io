<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的小站</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        .banner{
            background: linear-gradient(135deg,#8050b8,#483282);
            color:white;
            text-align:center;
            padding:70px 20px;
        }
        .avatar{
            width:80px;
            height:80px;
            background:#fff;
            border-radius:50%;
            margin:0 auto 20px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:40px;
        }
        h1{
            font-size:48px;
            font-weight:normal;
            margin-bottom:16px;
        }
        .info{
            opacity:0.8;
            font-size:18px;
            line-height:1.8;
        }
        nav{
            background:#f7f7f7;
            max-width:1000px;
            margin:-20px auto 0;
            border-radius:8px 8px 0 0;
            padding:16px;
            text-align:center;
        }
        nav a{
            display:inline-block;
            padding:8px 20px;
            margin:0 4px;
            text-decoration:none;
            color:#444;
            border-radius:6px;
        }
        nav a.active{
            background:#ffffff;
        }
        main{
            max-width:1000px;
            margin:0 auto;
            background:white;
            padding:40px;
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="avatar">🚀</div>
        <h1>我的小站</h1>
        <div class="info">
            我的Blog：liyuxin101.github.io/blog<br>
            Blog@liyuxin101  b站@你的B站ID
        </div>
    </div>
    <nav>
        <a class="active" href="#">一个按钮</a>
        <a href="#">另一个按钮</a>
        <a href="#">第一阶段</a>
        <a href="#">(•̀ ω •́ )y</a>
    </nav>
    <main>
        <h2>本站导航</h2>
    </main>
</body>
</html>
