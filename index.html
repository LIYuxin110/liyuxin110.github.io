<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>我的网站</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box‑sizing:border‑box;margin:0;padding:0;font‑family:system‑ui}
body{background:#f3f4f6}
nav{background:#1f2937;color:white;padding:16px 24px;display:flex;gap:16px;align‑items:center}

.card{background:white;padding:24px;border‑radius:8px;margin:12px 0}
button{padding:9px 14px;border:none;border‑radius:6px;cursor:pointer;margin:4px}
.btn‑blue{background:#2563eb;color:white}
</style>
</head>
<body>
<nav>
  <h3>我的网站</h3>
  <a href="index.html">首页</a>
  <a href="blog.html">博客</a>
  <div id="navBtn"></div>
</nav>
<div class="container">
<div class="card">
  <h1>欢迎访问我的网站</h1>
  <p>这是一套带注册登录、后台管理、博客与评论系统的个人站点。</p>
</div>
</div>

<script>
const SUPABASE_URL = "https://scrmlnmmmixstxcmvcyw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjcm1sbm1tbWl4c3R4Y212Y3l3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NTgzMTcsImV4cCI6MjEwMjUzNDMxN30.oIZ8OYHpii6SdYy1zTlMAF4MHWfFDOJJDdiJp4luH_s";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function renderNav(){
  const {data:{session}} = await supabase.auth.getSession();
  const dom=document.getElementById("navBtn");
  if(!session){
    dom.innerHTML=`<a href="login.html"><button>登录</button></a><a href="register.html"><button>注册</button></a>`;
  }else{
    const {data:prof}=await supabase.from("user_profile").select("is_admin").eq("id",session.user.id).single();
    let html=`<a href="user‑profile.html"><button class="btn‑blue">编辑自我介绍</button></a>`;
    if(prof?.is_admin) html+=`<a href="admin‑panel.html"><button class="btn‑blue">管理后台</button></a>`;
    html+=`<button onclick="logout()">退出登录</button>`;
    dom.innerHTML=html;
  }
}
async function logout(){
  await supabase.auth.signOut();
  location.reload();
}
renderNav();
</script>
</body>
</html>
