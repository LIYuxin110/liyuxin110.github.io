<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网站管理后台</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
    body{background:#f3f4f6;padding:20px}
    .container{max-width:1200px;margin:0 auto}
    .header{display:flex;justify-content:space-between;align-items:center;background:#1f2937;color:white;padding:16px 24px;border-radius:8px;margin-bottom:20px}
    .tab-wrap{display:flex;gap:8px;margin-bottom:16px}
    .tab{padding:10px 18px;background:#e5e7eb;border:none;border-radius:6px;cursor:pointer}
    .tab.active{background:#2563eb;color:white}
    .panel{background:white;padding:24px;border-radius:8px;display:none}
    .panel.show{display:block}
    textarea,input{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;margin:8px 0;font-size:15px}
    button{padding:9px 16px;border:none;border-radius:6px;cursor:pointer;margin:4px}
    .btn-blue{background:#2563eb;color:white}
    .btn-red{background:#dc2626;color:white}
    .btn-orange{background:#f97316;color:white}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{border:1px solid #e5e7eb;padding:10px;text-align:left}
    th{background:#f9fafb}
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h2>网站管理后台</h2>
    <div>
      <span id="userInfo"></span>
      <button onclick="logout()">退出登录</button>
      <a href="index.html"><button>返回首页</button></a>
    </div>
  </div>

  <div class="tab-wrap">
    <button class="tab active" data-tab="articleTab">博客文章管理</button>
    <button class="tab" data-tab="userTab">用户管理(禁言/封号)</button>
    <button class="tab" data-tab="commentTab">讨论评论管理</button>
  </div>

  <!--文章管理-->
  <div id="articleTab" class="panel show">
    <h3>发布/编辑博客文章</h3>
    <input type="hidden" id="editArticleId">
    <label>文章标题</label>
    <input type="text" id="artTitle" placeholder="输入文章标题">
    <label>文章正文</label>
    <textarea rows="10" id="artContent" placeholder="在这里写文章内容"></textarea>
    <button class="btn-blue" onclick="saveArticle()">保存文章</button>
    <hr style="margin:20px 0;">
    <h4>已发布文章列表</h4>
    <div id="articleList"></div>
  </div>

  <!--用户管理-->
  <div id="userTab" class="panel">
    <h3>全部注册用户｜禁言、封号操作</h3>
    <table>
      <thead>
        <tr>
          <th>用户ID</th>
          <th>管理员</th>
          <th>禁言状态</th>
          <th>封号状态</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>
  </div>

  <!--评论管理-->
  <div id="commentTab" class="panel">
    <h3>讨论区评论管理</h3>
    <div id="commentList"></div>
  </div>
</div>

<script>
// =========在这里填你的supabase配置========
const SUPABASE_URL = "你的项目URL";
const SUPABASE_ANON_KEY = "你的anon公钥";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let isAdmin = false;

//标签切换
document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('show'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab).classList.add('show');
    if(tab.dataset.tab==="userTab") loadAllUser();
    if(tab.dataset.tab==="commentTab") loadAllComment();
  }
})

//登录校验
async function checkAuth(){
  const {data:{session}} = await supabase.auth.getSession();
  if(!session){
    alert("未登录，跳转登录页");
    window.location.href="login.html";
    return;
  }
  currentUser = session.user;
  document.getElementById("userInfo").innerText = `当前：${currentUser.email}`;
  //判断是否管理员
  const {data:up} = await supabase.from("user_profile").select("is_admin,is_banned").eq("id",currentUser.id).single();
  if(!up || !up.is_admin){
    alert("你不是管理员，禁止访问后台");
    window.location.href="index.html";
    return;
  }
  if(up.is_banned){
    await supabase.auth.signOut();
    alert("账号已被封禁");
    window.location.href="login.html";
    return;
  }
  isAdmin=true;
  loadArticleList();
}

//退出
async function logout(){
  await supabase.auth.signOut();
  window.location.href="login.html";
}

//文章保存
async function saveArticle(){
  const title = document.getElementById("artTitle").value.trim();
  const content = document.getElementById("artContent").value.trim();
  const editId = document.getElementById("editArticleId").value;
  if(!title||!content){alert("标题和内容不能为空");return;}

  if(editId){
    await supabase.from("articles").update({title,content}).eq("id",editId);
  }else{
    await supabase.from("articles").insert({title,content});
  }
  document.getElementById("artTitle").value="";
  document.getElementById("artContent").value="";
  document.getElementById("editArticleId").value="";
  loadArticleList();
  alert("保存成功！");
}

//加载文章
async function loadArticleList(){
  const {data} = await supabase.from("articles").select("*").order("id",{asc:false});
  const wrap = document.getElementById("articleList");
  wrap.innerHTML="";
  if(!data||data.length===0){wrap.innerHTML="<p>暂无文章，请发布第一篇博客</p>";return;}
  data.forEach(art=>{
    const div = document.createElement("div");
    div.style.padding="12px;border:"1px solid #eee";div.style.margin="6px 0";
    div.innerHTML = `
      <div><b>${art.title}</b></div>
      <button class="btn-blue" onclick="editArt(${art.id},'${escapeHtml(art.title)}','${escapeHtml(art.content)}')">编辑</button>
      <button class="btn-red" onclick="delArt(${art.id})">删除</button>
    `;
    wrap.appendChild(div);
  })
}
window.editArt=async function(id,title,content){
  document.getElementById("editArticleId").value=id;
  document.getElementById("artTitle").value=unescapeHtml(title);
  document.getElementById("artContent").value=unescapeHtml(content);
}
window.delArt=async function(id){
  if(!confirm("确认删除？"))return;
  await supabase.from("articles").delete().eq("id",id);
  loadArticleList();
}

//加载全部用户
async function loadAllUser(){
  const {data} = await supabase.from("user_profile").select("*");
  const tbody = document.getElementById("userTableBody");
  tbody.innerHTML="";
  data.forEach(u=>{
    const tr = document.createElement("tr");
    tr.innerHTML=`
      <td>${u.id}</td>
      <td>${u.is_admin?"✅是":"❌否"}</td>
      <td>${u.is_muted?"🔇已禁言":"正常"}</td>
      <td>${u.is_banned?"⛔已封号":"正常"}</td>
      <td>
        <button class="btn-orange" onclick="toggleMute('${u.id}',${!u.is_muted})">${u.is_muted?"解除禁言":"禁言"}</button>
        <button class="btn-red" onclick="toggleBan('${u.id}',${!u.is_banned})">${u.is_banned?"解除封号":"封号"}</button>
      </td>
    `;
    tbody.appendChild(tr);
  })
}

//禁言切换
window.toggleMute = async function(uid,val){
  await supabase.from("user_profile").update({is_muted:val}).eq("id",uid);
  loadAllUser();
}
//封号切换
window.toggleBan = async function(uid,val){
  if(!confirm(val?"确认封号该用户":"确认解除封号？"))return;
  await supabase.from("user_profile").update({is_banned:val}).eq("id",uid);
  loadAllUser();
}

//加载评论
async function loadAllComment(){
  const {data,error}=await supabase.from("comments").select("*,user_profile(*)").order("created_at",{asc:false});
  const wrap = document.getElementById("commentList");
  wrap.innerHTML="";
  if(!data||data.length===0){wrap.innerHTML="<p>暂无讨论区评论</p>";return;}
  data.forEach(c=>{
    const div=document.createElement("div");
    div.style.border="1px solid #eee";div.style.padding="12px";div.style.margin="8px 0";
    div.innerHTML=`
      <div>用户:${c.user_profile?.id||"未知"}｜${new Date(c.created_at).toLocaleString()}</div>
      <div>${escapeHtml(c.content)}</div>
      <button class="btn-red" onclick="delComment(${c.id})">删除这条评论</button>
    `;
    wrap.appendChild(div);
  })
}
window.delComment=async function(cid){
  if(!confirm("删除评论？"))return;
  await supabase.from("comments").delete().eq("id",cid);
  loadAllComment();
}

function escapeHtml(str){
  if(!str)return "";
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function unescapeHtml(str){
  if(!str)return "";
  return str.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">");
}

checkAuth();
</script>
</body>
</html>
