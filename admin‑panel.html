<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - 发布博客</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #f3f4f6;
            padding:30px;
            max-width:900px;
            margin: 0 auto;
        }
        .container{
            background:#ffffff;
            padding:32px;
            border-radius:12px;
            box-shadow:0 2px 12px #00000014;
        }
        h1{
            margin-bottom:24px;
            color:#1f2937;
        }
        .item{
            margin-bottom:18px;
        }
        label{
            display:block;
            margin-bottom:6px;
            font-weight:500;
            color:#374151;
        }
        input,textarea{
            width:100%;
            border:1px solid #d1d5db;
            border-radius:8px;
            padding:12px;
            font-size:15px;
        }
        textarea{
            min-height:220px;
            resize: vertical;
        }
        button{
            background:#2563eb;
            color:white;
            border:none;
            padding:13px 26px;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
        }
        button:hover{
            background:#1d4ed8;
        }
        #msg{
            margin-top:16px;
        }
        .back{
            margin-bottom:20px;
        }
        .back a{
            color:#2563eb;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="back"><a href="index.html">← 返回首页</a></div>
    <h1>博客文章发布后台</h1>

    <div class="item">
        <label>文章标题</label>
        <input id="title" placeholder="输入文章标题">
    </div>

    <div class="item">
        <label>简介（article_desc）</label>
        <input id="article_desc" placeholder="简短文章简介">
    </div>

    <div class="item">
        <label>正文内容</label>
        <textarea id="content" placeholder="写博客正文..."></textarea>
    </div>

    <button id="submitBtn">提交发布文章</button>
    <div id="msg"></div>
</div>

<script type="module">
// 直接引入配置文件，不再写密钥
import {supabase, isAdminUser} from "./supabase-config.js";

document.querySelector("#submitBtn").addEventListener("click", async ()=>{
    // 校验是否管理员
    const adminOk = await isAdminUser();
    if(!adminOk){
        document.querySelector("#msg").innerText="❌你不是管理员，禁止发布";
        document.querySelector("#msg").style.color="#dc2626";
        return;
    }

    const title = document.querySelector("#title").value.trim();
    const article_desc = document.querySelector("#article_desc").value.trim();
    const content = document.querySelector("#content").value.trim();
    const msgDom = document.querySelector("#msg");

    if(!title || !content){
        msgDom.innerText = "⚠️标题和正文不能为空";
        msgDom.style.color="#dc2626";
        return;
    }

    msgDom.innerText = "正在提交……";
    msgDom.style.color="#374151";

    const { error } = await supabase.from("articles").insert([
        {
            title: title,
            article_desc: article_desc,
            content: content,
            publish_at: new Date().toISOString()
        }
    ]);

    if(error){
        msgDom.innerText = "❌发布失败："+error.message;
        msgDom.style.color="#dc2626";
        console.error(error);
    }else{
        msgDom.innerText = "✅文章发布成功！";
        msgDom.style.color="#16a34a";
        document.querySelector("#title").value = "";
        document.querySelector("#article_desc").value = "";
        document.querySelector("#content").value = "";
    }
})
</script>
</body>
</html>
