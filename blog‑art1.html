<h2>CSP‑J备考：二分查找学习总结</h2>
<div class="time">发布时间：2026‑08‑17</div>
<p>二分查找适用于有序序列，核心思想不断缩小查找区间。写代码最容易出错就是边界条件，左闭右闭、左闭右开两种写法不要搞混。</p>
<p>做题的时候，先确认数组是否已经排序，再考虑二分。除了找数值，很多求最大最小值的题也可以用二分答案。</p>
