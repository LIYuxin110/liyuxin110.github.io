<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>登录 | liyuxin110</title>
<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Microsoft Yahei", sans-serif;
  background-color:#0f172a;
  color:#cbd5e1;
  line-height:1.7;
  min-height:100vh;
}
header {
  background-color:rgba(15,23,42,0.85);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,0.08);
  position:sticky;
  top:0;
  z-index:10;
}
.nav-container {
  max-width:1160px;
  margin:0 auto;
  padding:0 24px;
  height:64px;
  display:flex;
  align-items:center;
  gap:32px;
}
.logo {
  font-size:18px;
  font-weight:600;
  color:#ffffff;
  margin-right:auto;
}
.nav-container a {
  color:#94a3b8;
  text-decoration:none;
  font-size:15px;
  transition:0.25s;
}
.nav-container a:hover {
  color:#38bdf8;
}

/* 登录表单核心，对标京东表单交互 */
.auth-wrap{
  min-height:calc(100vh - 64px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
}
.auth-card{
  width:100%;
  max-width:440px;
  background:#1e293b;
  border:1px solid #334155;
  border-radius:14px;
  padding:42px 36px;
  box-shadow:0 8px 30px rgba(0,0,0,0.35);
}
.auth-card h2{
  font-size:26px;
  color:#f1f5f9;
  margin-bottom:8px;
}
.auth-desc{
  color:#94a3b8;
  font-size:15px;
  margin-bottom:32px;
}
.form-item{
  margin-bottom:22px;
}
.form-item label{
  display:block;
  font-size:14px;
  color:#cbd5e1;
  margin-bottom:8px;
}
.input-box{
  position:relative;
}
.form-item input{
  width:100%;
  padding:14px 16px;
  padding-right:44px;
  background:#0f172a;
  border:1px solid #475569;
  border-radius:8px;
  font-size:16px;
  color:#e2e8f0;
  outline:none;
  transition:0.22s ease;
}
.form-item input:focus{
  border-color:#38bdf8;
  box-shadow:0 0 0 3px rgba(56,189,248,0.15);
}
.form-item.input-error input{
  border-color:#ef4444;
}
.error-text{
  color:#ef4444;
  font-size:13px;
  margin-top:6px;
  display:none;
}
.form-item.input-error .error-text{
  display:block;
}
.pwd-toggle{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  color:#94a3b8;
  cursor:pointer;
  font-size:14px;
  user-select:none;
}
.submit-btn{
  width:100%;
  padding:14px;
  background:#38bdf8;
  border:none;
  border-radius:8px;
  color:#0f172a;
  font-weight:600;
  font-size:16px;
  cursor:pointer;
  transition:0.22s;
}

  background:#0ea5e9;
}
