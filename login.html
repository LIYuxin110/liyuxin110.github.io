<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;display:flex;align-items:center;justify-content:center;height:100vh}
.box{background:#1e293b;padding:32px;border-radius:10px;width:420px;border:1px solid #334155}
h2{text-align:center;margin-bottom:24px}
input{width:100%;padding:12px;margin:8px 0;background:#0f172a;color:#e2e8f0;border:1px solid #475569;border-radius:6px}
button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;margin-top:8px;cursor:pointer}
.link{text-align:center;margin-top:14px}
.link a{color:#38bdf8;text-decoration:none}
</style>
</head>
<body>
<div class="box">
    <h2>账号登录</h2>
    <input type="email" id="email" placeholder="邮箱">
    <input type="password" id="pwd" placeholder="密码">
    <button onclick="doLogin()">登录</button>
    <div id="msg" style="margin-top:10px;color:#f87171"></div>
    <div class="link">
        <a href="register.html">注册账号</a>｜<a href="index.html">返回首页</a>
    </div>
</div>
<script>
const SUPABASE_URL = "https://scrmlnmmmixstxcmvcyw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjcm1sbm1tbWl4c3R4Y212Y3l3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NTgzMTcsImV4cCI6MjEwMjUzNDMxN30.oIZ8OYHpii6SdYy1zTlMAF4MHWfFDOJJDdiJp4luH_s";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function doLogin(){
    const email=document.getElementById("email").value.trim();
    const pwd=document.getElementById("pwd").value;
    const {data,error}=await supabase.auth.signInWithPassword({email,password:pwd});
    if(error){
        document.getElementById("msg").innerText="登录失败："+error.message;
        return;
    }
    location.href="index.html";
}
</script>
</body>
</html>
