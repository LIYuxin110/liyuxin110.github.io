<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>注册账号</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box‑sizing:border‑box;margin:0;padding:0;font‑family:system‑ui}
body{background:#f3f4f6;display:flex;align‑items:center;justify‑content:center;height:100vh}
.box{background:white;padding:32px;border‑radius:10px;width:400px}
h2{margin‑bottom:24px;text‑align:center}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border‑radius:6px;font‑size:15px}
button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border‑radius:6px;margin‑top:8px;font‑size:15px;cursor:pointer}
.link{text‑align:center;margin‑top:12px}
</style>
</head>
<body>
<div class="box">
  <h2>新用户注册</h2>
  <input type="email" id="email" placeholder="邮箱">
  <input type="password" id="pwd" placeholder="密码，最少6位">
  <button onclick="doReg()">注册</button>
  <div id="msg"></div>
  <div class="link">
    <a href="login.html">去登录</a>｜<a href="index.html">返回首页</a>
  </div>
</div>

<script>
const SUPABASE_URL = "https://scrmlnmmmixstxcmvcyw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjcm1sbm1tbWl4c3R4Y212Y3l3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NTgzMTcsImV4cCI6MjEwMjUzNDMxN30.oIZ8OYHpii6SdYy1zTlMAF4MHWfFDOJJDdiJp4luH_s";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function doReg(){

  document.getElementById("msg").innerText="注册成功，请查收邮箱验证邮件后登录";
}
