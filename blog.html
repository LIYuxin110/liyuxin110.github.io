body{background:#f3f4f6;padding:24px}
.container{max‑width:900px;margin:0 auto}
.card{background:#fff;padding:18px;border‑radius:8px;margin‑bottom:12px;border:1px solid #e5e7eb}

<body>
<div class="container">

<h2>📖博客文章列表</h2>
<div id="articleWrap"></div>
</div>

<script>
const SUPABASE_URL = "https://scrmlnmmmixstxcmvcyw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjcm1sbm1tbWl4c3R4Y212Y3l3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NTgzMTcsImV4cCI6MjEwMjUzNDMxN30.oIZ8OYHpii6SdYy1zTlMAF4MHWfFDOJJDdiJp4luH_s";
const supabase = window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

async function loadBlogList(){
  const {data}=await supabase.from("articles").select("*").order("id",{asc:false});
  const wrap=document.getElementById("articleWrap");
  if(!data||data.length===0){
    wrap.innerHTML="<p>还没有文章，请管理员去后台发布</p>";
    return;
  }
  data.forEach(item=>{
    wrap.innerHTML+=`
    <div class="card">
      <h3><a href="blog‑detail.html?id=${item.id}">${item.title}</a></h3>
    </div>
    `
  })
}
loadBlogList();
</script>
</body>
