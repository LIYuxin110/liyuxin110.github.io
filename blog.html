<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>博客 | liyuxin110</title>
<style>
*{margin:0;padding:0;box‑sizing:border‑box;font‑family:system‑ui}
body{background:#f3f4f6;padding:24px;max‑width:920px;margin:0 auto}
h1{margin‑bottom:24px;color:#111827}
.blog‑item{background:white;padding:20px;border‑radius:10px;margin‑bottom:16px;box‑shadow:0 1px 8px #00000012}
.blog‑item h2{margin‑bottom:8px;color:#1f2937}
.desc{color:#4b5563;margin‑bottom:10px}
.time{font‑size:13px;color:#6b7280;margin‑bottom:12px}
.content{line‑height:1.7;color:#222}
.back{margin‑bottom:20px}
.back a{color:#2563eb}
</style>
</head>
<body>
<div class="back"><a href="index.html">← 返回首页</a></div>
<h1>博客文章列表</h1>
<div id="blogList"></div>

<script type="module">
import {supabase} from "./supabase-config.js";

async function loadBlog(){
    const {data,error}=await supabase
        .from("articles")
        .select("*")
        .order("publish_at",{ascending:false});
    if(error){
        document.querySelector("#blogList").innerText="读取博客出错："+error.message;
        return;
    }
    const dom=document.querySelector("#blogList");
    if(data.length===0){
        dom.innerText="暂无文章，请前往后台发布第一篇博客";
        return;
    }
    data.forEach(art=>{
        const div=document.createElement("div");
        div.className="blog‑item";
        div.innerHTML=`
            <h2>${art.title}</h2>
            <div class="desc">${art.article_desc||""}</div>
            <div class="time">${new Date(art.publish_at).toLocaleString()}</div>
            <div class="content">${art.content}</div>
        `;
        dom.appendChild(div);
    })
}
loadBlog();
</script>
</body>
</html>
