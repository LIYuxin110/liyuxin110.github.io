<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>编辑个人资料</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box‑sizing:border‑box;margin:0;padding:0;font‑family:system‑ui}
body{background:#f3f4f6;padding:24px}
.container{max‑width:700px;margin:0 auto;background:white;padding:28px;border‑radius:10px}
h2{margin‑bottom:20px}
textarea{width:100%;padding:11px;border:1px solid #d1d5db;border‑radius:7px;margin:8px 0;font‑size:15px;min‑height:180px}
button{padding:10px 18px;border:none;border‑radius:6px;cursor:pointer}
.btn‑blue{background:#2563eb;color:white}
.back{margin‑bottom:16px;display:inline‑block}
</style>
</head>
<body>
<div class="container">
<div class="back"><a href="index.html">← 返回首页</a></div>
<h2>编辑自我介绍</h2>
<textarea id="bio" placeholder="在这里填写你的个人介绍"></textarea>
<button class="btn‑blue" onclick="save()">保存资料</button>
<div id="msg"></div>
</div>

<script>
const SUPABASE_URL = "https://scrmlnmmmixstxcmvcyw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjcm1sbm1tbWl4c3R4Y212Y3l3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NTgzMTcsImV4cCI6MjEwMjUzNDMxN30.oIZ8OYHpii6SdYy1zTlMAF4MHWfFDOJJDdiJp4luH_s";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let uid;

async function check(){
  const {data:{session}}=await supabase.auth.getSession();
  if(!session){location.href="login.html";return;}
  uid=session.user.id;
  const {data}=await supabase.from("user_profile").select("bio").eq("id",uid).single();
  if(data?.bio) document.getElementById("bio").value=data.bio;
}
async function save(){
  const bio=document.getElementById("bio").value.trim();
  const {error}=await supabase.from("user_profile").update({bio}).eq("id",uid);
  if(error){
    document.getElementById("msg").innerText="保存失败："+error.message;
  }else{
    document.getElementById("msg").innerText="✅保存成功";
  }
}
check();
</script>
</body>
</html>
